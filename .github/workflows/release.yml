# Builds the Windows installer from source on a GitHub-hosted runner and, once SignPath is set
# up, signs it through the SignPath Foundation. It only produces workflow artifacts: it never
# creates or edits a GitHub release, so publishing stays a manual step.
#
# SignPath signs ScreenPrompt in two requests because it can't look inside NSIS installers:
#   1. build screenprompt.exe and sign it ("app-exe" artifact configuration)
#   2. bundle the signed exe into the installer with --no-binary-patching, so the bundler leaves
#      the signature intact, then sign the installer ("installer" artifact configuration)
# The artifact configurations live in .signpath/artifact-configurations/.
#
# Signing is skipped (and the installer is labelled UNSIGNED) until the repository variable
# SIGNPATH_ORGANIZATION_ID and the SIGNPATH_API_TOKEN secret exist. Optional variables:
# SIGNPATH_PROJECT_SLUG (default "ScreenPrompt") and SIGNPATH_SIGNING_POLICY_SLUG (default
# "release-signing").
#
# Nothing is cached on purpose: SignPath's origin verification expects every signed build to
# start clean rather than reuse output from earlier, unverified builds.

name: Release build

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 180
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      RELEASE_DIR: screenprompt-tauri/src-tauri/target/release
    defaults:
      run:
        shell: bash
        working-directory: screenprompt-tauri

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          package-manager-cache: false

      # The Rust version is pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: screenprompt-tauri/src-tauri
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          npm_version=$(node -p "require('./package.json').version")
          cargo_version=$(tr -d '\r' < src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$npm_version" != "$version" ] || [ "$cargo_version" != "$version" ]; then
            echo "::error::versions differ: tauri.conf.json $version," \
              "package.json $npm_version, Cargo.toml $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: npm ci

      - name: Build app
        run: npx tauri build --no-bundle -- --locked

      - name: Upload unsigned app
        id: upload-unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: screenprompt-exe-unsigned
          path: ${{ env.RELEASE_DIR }}/screenprompt.exe
          if-no-files-found: error

      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ScreenPrompt' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Use signed app
        if: env.SIGN == 'true'
        working-directory: .
        run: cp signed-exe/screenprompt.exe "$RELEASE_DIR/screenprompt.exe"

      - name: Bundle installer
        run: npx tauri bundle --bundles nsis --no-binary-patching

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: screenprompt-installer-unsigned
          path: >-
            ${{ env.RELEASE_DIR }}/bundle/nsis/ScreenPrompt_${{ steps.version.outputs.version
            }}_x64-setup.exe
          if-no-files-found: error

      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ScreenPrompt' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Upload signed installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ScreenPrompt_${{ steps.version.outputs.version }}_x64-setup
          path: signed-installer/ScreenPrompt_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
